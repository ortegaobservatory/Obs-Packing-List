<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Master Packing List</title>
<!--Hi Luis -->
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2033;--mu:#667;--ac:#3b5bdb;--ok:#2f9e44;--bd:#dde1ee;--hd:#eef1fb;--tab:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558;--hd:#1f2947;--tab:#131a30}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558;--hd:#1f2947;--tab:#131a30}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
#bar{display:none;background:#fff3cd;color:#3b3000;border-bottom:1px solid #e0c36a;padding:6px 12px;font-size:13px;text-align:center}
#sheet{flex:1;overflow:auto;padding:14px 16px 20px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.4rem;margin:2px 0 2px}.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--hd);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700;position:sticky;top:0}
td.item a{color:var(--ac);font-weight:600;cursor:pointer;text-decoration:none}
td.item a:hover{text-decoration:underline}
td.l{white-space:normal;min-width:130px}
tr.done td.nm{text-decoration:line-through;color:var(--mu)}
input[type=checkbox]{width:20px;height:20px;margin:0;vertical-align:middle;accent-color:var(--ok);cursor:pointer}
input:disabled{cursor:default;opacity:.85}
.bar{height:6px;min-width:90px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pr{display:flex;align-items:center;gap:8px;justify-content:center}.pr span{font-size:.8rem;color:var(--mu);min-width:34px;text-align:left}
.top{margin:0 0 14px}.top .bar{margin-top:8px}
#tabs{display:flex;overflow-x:auto;background:var(--tab);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;flex:none;-webkit-overflow-scrolling:touch}
#tabs button{flex:none;border:0;background:transparent;font:inherit;font-size:.88rem;color:var(--mu);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
#tabs button.on{background:var(--ac);color:#fff;font-weight:600}
#tabs button:hover:not(.on){background:var(--hd)}
#tabs button.ok:not(.on){color:var(--ok)}
</style></head><body>
<div id="bar"></div>
<div id="sheet"></div>
<div id="tabs"></div>
<script>
const PAGES=[{"id": "eagle1", "t": "Eagle 1", "ty": "Sky-Watcher Dobsonian", "need": false, "items": [{"n": "Telescope", "l": "Observatory", "d": false}, {"n": "Mesh dust cover and Cap \n(Do not remove unless in use)*", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Padle", "l": "Observatory", "d": false}, {"n": "Azimuth Motor Cord", "l": "Observatory", "d": false}]}, {"id": "andromeda1", "t": "Andromeda 1", "ty": "Newtonian", "need": false, "items": [{"n": "Telescope", "l": "Observatory", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight (big one)", "l": "", "d": false}, {"n": "Counter weight shaft", "l": "", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "", "d": false}, {"n": "Padle", "l": "", "d": false}]}, {"id": "triangulum2", "t": "Triangulum 2", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "", "d": false}]}, {"id": "whirlpool3", "t": "Whirlpool 3", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "helix4", "t": "Helix 4", "ty": "11-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Observatory Classroom", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight (big and small one)", "l": "Observatory Classroom", "d": false}, {"n": "Counter weight shaft", "l": "Observatory Classroom", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory Classroom", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "cartwheel5", "t": "Cartwheel 5", "ty": "NexStar Alt-Az, 8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Observatory", "d": false}]}, {"id": "starfish6", "t": "Starfish 6", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "tadpole7", "t": "Tadpole 7", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "crab8", "t": "Crab 8", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "unistellar", "t": "Unistellar", "ty": "Unistellar eV-scope", "need": false, "items": [{"n": "Bag = Telescope + Mount", "l": "Observatory Classroom", "d": true}, {"n": "Projector", "l": "Observatory", "d": true}, {"n": "Projector Screen", "l": "Observatory", "d": true}, {"n": "Ipad", "l": "Observatory", "d": true}, {"n": "Stool", "l": "Telescope Closet", "d": true}, {"n": "TV", "l": "Observatory Classroom", "d": false}]}, {"id": "technology", "t": "Technology", "ty": "Tech", "need": false, "items": [{"n": "Speaker", "l": "Observatory", "d": false}, {"n": "Microphone", "l": "Observatory", "d": false}, {"n": "Walkie-Talkie", "l": "Observatory Storage Cabinet 1", "d": false}]}, {"id": "maintable", "t": "Main Table", "ty": "General", "need": false, "items": [{"n": "Table", "l": "Observatory", "d": true}, {"n": "Merch", "l": "", "d": false}, {"n": "Pens/Pencils", "l": "", "d": false}, {"n": "Activities Sheets", "l": "", "d": false}, {"n": "FIT Table Cloth", "l": "Observatory", "d": true}, {"n": "Donation Banner", "l": "Observatory Classroom", "d": true}, {"n": "3-D printed celestial objects", "l": "Observatory Classroom", "d": true}]}, {"id": "daytime", "t": "Daytime", "ty": "General", "need": false, "items": [{"n": "Canopies", "l": "Telescope Closet", "d": false}, {"n": "Orange Cushions", "l": "Telescope Closet", "d": false}, {"n": "First-Aid", "l": "Observatory?", "d": false}, {"n": "Tools- Lauren make a toolbox", "l": "", "d": false}, {"n": "Sun Spotter - Solar Events", "l": "Observatory", "d": false}, {"n": "Solar Filters", "l": "Observatory", "d": false}, {"n": "Drone", "l": "Observatory Classroom", "d": false}, {"n": "Camera", "l": "Observatory Classroom", "d": false}]}, {"id": "nighttime", "t": "Nighttime", "ty": "General", "need": false, "items": [{"n": "Canopies", "l": "Telescope Closet", "d": false}, {"n": "Orange Cushions", "l": "Telescope Closet", "d": false}, {"n": "First-Aid", "l": "Observatory", "d": false}, {"n": "Tools- Lauren make a toolbox", "l": "Observatory", "d": false}, {"n": "Drone", "l": "Observatory Classroom", "d": false}, {"n": "Camera", "l": "Observatory Classroom", "d": false}]}, {"id": "kosmos", "t": "Kosmos", "ty": "PlaneWave CDK 20", "need": false, "items": [{"n": "20-inch", "l": "Physics High bay", "d": false}, {"n": "Laptop", "l": "Observatory", "d": false}]}], TABS=["Master List", "Daytime", "Nighttime", "Main Table", "Technology", "Crab 8", "Starfish 6", "Tadpole 7", "Helix 4", "Whirlpool 3", "Eagle 1", "Andromeda 1", "Triangulum 2", "Unistellar", "Cartwheel 5", "Kosmos"];
/* Paste your Google Apps Script Web app URL here (see Code.gs): */
const SYNC_URL='https://script.google.com/macros/s/AKfycbzLV0_gJ8OFI3UdATBchgszGDVm6oPxK1y25BxFk0RUJndqDMvgUkhdFqobiBkXsBIE/exec';
const $=document.getElementById('sheet'),T=document.getElementById('tabs'),B=document.getElementById('bar');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const qk=new URLSearchParams(location.search).get('k');
if(qk){sv('key',qk);history.replaceState(null,'',location.pathname+location.hash)}
const KEY=ld('key','');
let packed=ld('packed',{});
const byT=Object.fromEntries(PAGES.map(p=>[p.t,p]));
const isOn=(p,i)=>{const v=(packed[p.id]||{})['i'+i];return v===undefined?p.items[i].d:v};
const full=p=>p.items.length>0&&p.items.every((_,i)=>isOn(p,i));
const cur=()=>decodeURIComponent(location.hash.slice(1))||'Master List';
const cnt=p=>[p.items.filter((_,i)=>isOn(p,i)).length,p.items.length];
const bar=(a,b)=>`<div class="pr"><div class="bar" style="flex:1"><i style="width:${b?a/b*100:0}%"></i></div><span>${a}/${b}</span></div>`;
function master(){
  return `<div class="wrap"><h1>\u{1F52D} Master Packing List</h1><p class="sub">Tap an item to open its checklist.</p><div class="card"><table><tr><th>Item</th><th>Type</th><th>Needed For Event</th><th>Progress</th><th>Packed in Trailer?</th></tr>`+
  PAGES.map(p=>{const[a,b]=cnt(p);return `<tr><td class="item"><a onclick="go('${esc(p.t)}')">${esc(p.t)}</a></td><td>${esc(p.ty)}</td><td><input type="checkbox" disabled ${p.need?'checked':''}></td><td>${bar(a,b)}</td><td><input type="checkbox" disabled ${full(p)?'checked':''} title="Checks automatically when every item on its tab is packed"></td></tr>`}).join('')+`</table></div></div>`}
function sheet(p){const[a,b]=cnt(p);
  return `<div class="wrap"><div class="top"><h1>${esc(p.t)}</h1><p class="sub" style="margin:0">${esc(p.ty)} \u00b7 ${a}/${b} packed</p><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div></div><div class="card"><table><tr><th>Items</th><th>Location</th><th>Packed?</th></tr>`+
  p.items.map((it,i)=>`<tr class="${isOn(p,i)?'done':''}"><td class="nm l">${esc(it.n)}</td><td class="l">${esc(it.l)}</td><td><input type="checkbox" ${isOn(p,i)?'checked':''} onchange="tick('${p.id}',${i},this.checked)" aria-label="Packed: ${esc(it.n)}"></td></tr>`).join('')+`</table></div></div>`}
function render(){
  const c=cur(),p=byT[c];
  $.innerHTML=p?sheet(p):master();
  T.innerHTML=TABS.map(n=>{const q=byT[n],d=q&&full(q);const on=n===c||(!p&&n==='Master List');return `<button class="${on?'on':''} ${d?'ok':''}" onclick="go('${esc(n)}')">${d?'\u2713 ':''}${esc(n)}</button>`}).join('');
  const on=T.querySelector('.on');if(on&&!render.s){on.scrollIntoView({inline:'center',block:'nearest'});render.s=1}
}
function go(n){location.hash=n==='Master List'?'':encodeURIComponent(n)}
async function pull(){if(!SYNC_URL||document.hidden)return;
  try{const r=await (await fetch(SYNC_URL+'?k='+encodeURIComponent(KEY))).json();
    if(r.error){B.style.display='block';B.textContent='This link is missing its access key, so changes won\u2019t save. Ask for the full link.'}
    else{B.style.display='none';packed=r.state||{};sv('packed',packed)}render()}catch(e){}}
async function tick(id,i,v){packed[id]=Object.assign({},packed[id],{['i'+i]:v});sv('packed',packed);render();
  if(!SYNC_URL)return;
  try{const r=await (await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:KEY,id,i,v})})).json();
    if(r.error){alert('Not saved: '+r.error);pull()}}catch(e){alert('Could not reach the server. Your tick may not be saved.')}}
addEventListener('hashchange',()=>{render();$.scrollTo(0,0)});
render();pull();setInterval(pull,15000);
</script></body></html>
