@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558;--hd:#1f2947;--tab:#131a30}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558;--hd:#1f2947;--tab:#131a30}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
#bar{display:none;background:#fff3cd;color:#3b3000;border-bottom:1px solid #e0c36a;padding:6px 12px;font-size:13px;text-align:center}
#sheet{flex:1;overflow:auto;padding:14px 16px 20px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.4rem;margin:2px 0 2px}.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--hd);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700;position:sticky;top:0}
td.item a{color:var(--ac);font-weight:600;cursor:pointer;text-decoration:none}
td.item a:hover{text-decoration:underline}
td.l{white-space:normal;min-width:130px}
tr.done td.nm{text-decoration:line-through;color:var(--mu)}
input[type=checkbox]{width:20px;height:20px;margin:0;vertical-align:middle;accent-color:var(--ok);cursor:pointer}
input:disabled{cursor:default;opacity:.85}
.bar{height:6px;min-width:90px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pr{display:flex;align-items:center;gap:8px;justify-content:center}.pr span{font-size:.8rem;color:var(--mu);min-width:34px;text-align:left}
.top{margin:0 0 14px}.top .bar{margin-top:8px}
#tabs{display:flex;overflow-x:auto;background:var(--tab);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px;flex:none;-webkit-overflow-scrolling:touch}
#tabs button{flex:none;border:0;background:transparent;font:inherit;font-size:.88rem;color:var(--mu);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
#tabs button.on{background:var(--ac);color:#fff;font-weight:600}
#tabs button:hover:not(.on){background:var(--hd)}
#tabs button.ok:not(.on){color:var(--ok)}
.in{width:100%;min-width:110px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;text-align:center}
button.sm{font:inherit;font-size:.85rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 11px;cursor:pointer}
button.sm.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.sm:disabled{opacity:.5;cursor:default}
.adm{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:0 auto 10px;max-width:900px;font-size:.85rem;color:var(--mu)}
.acts{white-space:nowrap}.add{margin:10px 0 0}
</style></head><body>

  const on=T.querySelector('.on');if(on&&!render.s){on.scrollIntoView({inline:'center',block:'nearest'});render.s=1}
}
function go(n){location.hash=n==='Master List'?'':encodeURIComponent(n)}
/* ---------- owner editing ---------- */
const mark=()=>{dirty=true;render()};
function toggleEdit(){edit=!edit;render()}
function setP(n,f,v){const p=PAGES[n];
  if(f==='t'){v=v.trim()||p.t;if(PAGES.some((q,j)=>j!==n&&q.t===v)||v==='Master List'){alert('That name is already used.');render();return}
    const x=TABS.indexOf(p.t);if(x>0)TABS[x]=v;p.t=v}
  else p[f]=typeof v==='string'?v.trim():v;mark()}
function addP(){let k=PAGES.length+1,t;do{t='New page '+k++}while(PAGES.some(q=>q.t===t));
  PAGES.push({id:'p'+uid(),t,ty:'',op:'',need:false,items:[]});TABS.push(t);mark()}
function delP(n){const p=PAGES[n];if(!confirm('Delete "'+p.t+'" and all its items?'))return;
  PAGES.splice(n,1);TABS=TABS.filter(x=>x!==p.t);mark()}
function setI(n,i,f,v){PAGES[n].items[i][f]=v.trim();mark()}
function addI(n){PAGES[n].items.push({n:'New item',l:'',d:false,k:uid()});mark()}
function delI(n,i){PAGES[n].items.splice(i,1);mark()}
function moveI(n,i,d){const a=PAGES[n].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];mark()}
async function save(){
  try{const r=await (await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:KEY,config:{pages:PAGES,tabs:TABS}})})).json();
    if(r.error){alert('Not saved: '+r.error);return}
    dirty=false;sv('cfg',{pages:PAGES,tabs:TABS});render()}catch(e){alert('Could not reach the server. Your changes are not saved yet.')}}
/* ---------- sync ---------- */
async function pull(){if(!SYNC_URL||document.hidden)return;
  try{const r=await (await fetch(SYNC_URL+'?k='+encodeURIComponent(KEY))).json();
    if(r.error){B.style.display='block';B.textContent='This link is missing its access key, so changes won\u2019t save. Ask for the full link.';render();return}
    B.style.display='none';packed=r.state||{};sv('packed',packed);admin=!!r.admin;
    if(r.config&&r.config.pages&&!dirty){PAGES=r.config.pages;TABS=r.config.tabs;sv('cfg',r.config)}
    if(!edit)render()}catch(e){}}
async function tick(id,i,v){const p=PAGES.find(q=>q.id===id),key=p.items[i].k;
  packed[id]=Object.assign({},packed[id],{[key]:v});sv('packed',packed);render();
  if(!SYNC_URL)return;
  try{const r=await (await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:KEY,id,key,v})})).json();
    if(r.error){alert('Not saved: '+r.error);pull()}}catch(e){alert('Could not reach the server. Your tick may not be saved.')}}
addEventListener('hashchange',()=>{render();$.scrollTo(0,0)});
render();pull();setInterval(pull,15000);
</script></body></html>
