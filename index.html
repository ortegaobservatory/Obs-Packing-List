<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2033;--mu:#667;--ac:#3b5bdb;--ok:#2f9e44;--bd:#dde1ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#18203a;--tx:#e8ebf7;--mu:#97a0c0;--ac:#7c9cff;--ok:#51cf66;--bd:#2a3558}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 12px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;display:block;color:inherit;text-decoration:none}
.card.mine{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.card b{display:block}.ty{color:var(--mu);font-size:.8rem}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--bd);margin:2px 3px 0 0}
.tag.ev{background:var(--ac);color:#fff}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:8px 0;cursor:pointer}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:6px}
.row input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--ok)}
.row.done .nm{text-decoration:line-through;color:var(--mu)}.row label{flex:1;cursor:pointer}.row .loc{display:block;color:var(--mu);font-size:.8rem}
.row.lock label{cursor:default}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.box input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;margin:4px 4px 0 0;font-size:.85rem}
.chip button,.hit{background:none;border:0;color:var(--ac);cursor:pointer;font:inherit}
.hit{display:block;padding:6px 2px;width:100%;text-align:left;color:var(--tx)}
.note{color:var(--mu);font-size:.85rem}
.me{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.sm{font:inherit;font-size:.8rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
</style></head><body><main id="app"></main>
<script>
const PAGES=[{"id": "eagle1", "t": "Eagle 1", "ty": "Sky-Watcher Dobsonian", "need": false, "items": [{"n": "Telescope", "l": "Observatory", "d": false}, {"n": "Mesh dust cover and Cap \n(Do not remove unless in use)*", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Padle", "l": "Observatory", "d": false}, {"n": "Azimuth Motor Cord", "l": "Observatory", "d": false}]}, {"id": "andromeda1", "t": "Andromeda 1", "ty": "Newtonian", "need": false, "items": [{"n": "Telescope", "l": "Observatory", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight (big one)", "l": "", "d": false}, {"n": "Counter weight shaft", "l": "", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "", "d": false}, {"n": "Padle", "l": "", "d": false}]}, {"id": "triangulum2", "t": "Triangulum 2", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Obse "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Observatory", "d": false}]}, {"id": "starfish6", "t": "Starfish 6", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "tadpole7", "t": "Tadpole 7", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "crab8", "t": "Crab 8", "ty": "8-inch Celestron", "need": false, "items": [{"n": "Telescope", "l": "Telescope Closet", "d": false}, {"n": "Motor", "l": "Observatory", "d": false}, {"n": "Battery", "l": "Observatory Storage Cabinet 1", "d": false}, {"n": "Cable", "l": "Observatory", "d": false}, {"n": "Lens case", "l": "Telescope Closet", "d": false}, {"n": "Red Flashlight", "l": "Telescope Closet", "d": false}, {"n": "Stool", "l": "Telescope Closet", "d": false}, {"n": "Counter weight", "l": "Observatory", "d": false}, {"n": "Counter weight shaft", "l": "Observatory", "d": false}, {"n": "Tripod", "l": "Observatory", "d": false}, {"n": "Mount spreader", "l": "Observatory", "d": false}, {"n": "Padle", "l": "Telescope Closet", "d": false}]}, {"id": "unistellar", "t": "Unistellar", "ty": "Unistellar eV-scope", "need": false, "items": [{"n": "Bag = Telescope + Mount", "l": "Observatory Classroom", "d": true}, {"n": "Projector", "l": "Observatory", "d": true}, {"n": "Projector Screen", "l": "Observatory", "d": true}, {"n": "Ipad", "l": "Observatory", "d": true}, {"n": "Stool", "l": "Telescope Closet", "d": true}, {"n": "TV", "l": "Observatory Classroom", "d": false}]}, {"id": "technology", "t": "Technology", "ty": "Tech", "need": false, "items": [{"n": "Speaker", "l": "Observatory", "d": false}, {"n": "Microphone", "l": "Observatory", "d": false}, {"n": "Walkie-Talkie", "l": "Observatory Storage Cabinet 1", "d": false}]}, {"id": "maintable", "t": "Main Table", "ty": "General", "need": false, "items": [{"n": "Table", "l": "Observatory", "d": true}, {"n": "Merch", "l": "", "d": false}, {"n": "Pens/Pencils", "l": "", "d": false}, {"n": "Activities Sheets", "l": "", "d": false}, {"n": "FIT Table Cloth", "l": "Observatory", "d": true}, {"n": "Donation Banner", "l": "Observatory Classroom", "d": true}, {"n": "3-D printed celestial objects", "l": "Observatory Classroom", "d": true}]}, {"id": "daytime", "t": "Daytime", "ty": "General", "need": false, "items": [{"n": "Canopies", "l": "Telescope Closet", "d": false}, {"n": "Orange Cushions", "l": "Telescope Closet", "d": false}, {"n": "First-Aid", "l": "Observatory?", "d": false}, {"n": "Tools- Lauren make a toolbox", "l": "", "d": false}, {"n": "Sun Spotter - Solar Events", "l": "Observatory", "d": false}, {"n": "Solar Filters", "l": "Observatory", "d": false}, {"n": "Drone", "l": "Observatory Classroom", "d": false}, {"n": "Camera", "l": "Observatory Classroom", "d": false}]}, {"id": "nighttime", "t": "Nighttime", "ty": "General", "need": false, "items": [{"n": "Canopies", "l": "Telescope Closet", "d": false}, {"n": "Orange Cushions", "l": "Telescope Closet", "d": false}, {"n": "First-Aid", "l": "Observatory", "d": false}, {"n": "Tools- Lauren make a toolbox", "l": "Observatory", "d": false}, {"n": "Drone", "l": "Observatory Classroom", "d": false}, {"n": "Camera", "l": "Observatory Classroom", "d": false}]}, {"id": "kosmos", "t": "Kosmos", "ty": "PlaneWave CDK 20", "need": false, "items": [{"n": "20-inch", "l": "Physics High bay", "d": false}, {"n": "Laptop", "l": "Observatory", "d": false}]}];
/* Paste your Google Apps Script Web app URL here (see Code.gs): */
const SYNC_URL='https://script.google.com/macros/s/AKfycbyRLrWp9MYI4JYEkKwLtbCR9NXhdhvIojNCLEX_wlfcC7UxDPj4MQ97AW5GssKTCiVm6w/exec';
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* The secret key arrives in the shared link (?k=...) and is remembered on that device. */
const qk=new URLSearchParams(location.search).get('k');
if(qk){sv('key',qk);history.replaceState(null,'',location.pathname+location.hash)}
const KEY=ld('key','');
let packed=ld('packed',{}),denied=false;
const page=id=>PAGES.find(p=>p.id===id);
const isOn=(p,i)=>{const v=(packed[p.id]||{})['i'+i];return v===undefined?p.items[i].d:v};
const prog=p=>[p.items.filter((_,i)=>isOn(p,i)).length,p.items.length];
function card(p){const[a,b]=prog(p);return `<a class="card" href="#${p.id}"><b>${esc(p.t)}</b><span class="ty">${esc(p.ty)}</span><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div><span class="ty">${a}/${b} packed${a===b&&b?' ✓':''}</span>${p.need?'<div><span class="tag ev">Needed for event</span></div>':''}</a>`}
function home(){const g={};PAGES.forEach(p=>{const k=/Celestron|Dobson|Newton|NexStar|PlaneWave|Unistellar/i.test(p.ty)?'Telescopes':'General & Tech';(g[k]=g[k]||[]).push(p)});
  $.innerHTML=`<h1>🔭 Master Packing List</h1><p class="sub">Open a page and tick items off as you pack.</p>${denied?'<div class="box">🔒 This link is missing its access key, so changes won\'t save. Ask for the full link.</div>':''}`+Object.entries(g).map(([k,l])=>`<h2>${k}</h2><div class="grid">${l.map(card).join('')}</div>`).join('')}
function sub(p){const[a,b]=prog(p);
  $.innerHTML=`<button class="back" onclick="location.hash=''">← All pages</button><h1>${esc(p.t)}</h1><p class="sub">${esc(p.ty)} · ${a}/${b} packed</p><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div><div style="margin-top:12px">`+p.items.map((it,i)=>`<div class="row ${isOn(p,i)?'done':''}"><input type="checkbox" id="c${i}" ${isOn(p,i)?'checked':''} onchange="tick('${p.id}',${i},this.checked)"><label for="c${i}"><span class="nm">${esc(it.n)}</span>${it.l?`<span class="loc">📍 ${esc(it.l)}</span>`:''}</label></div>`).join('')+'</div>'}
function render(){const p=page(location.hash.slice(1));p?sub(p):home()}
async function pull(){if(!SYNC_URL||document.hidden)return;
  try{const r=await (await fetch(SYNC_URL+'?k='+encodeURIComponent(KEY))).json();
    if(r.error){denied=true}else{denied=false;packed=r.state||{};sv('packed',packed)}render()}catch(e){}}
async function tick(id,i,v){packed[id]=Object.assign({},packed[id],{['i'+i]:v});sv('packed',packed);render();
  if(!SYNC_URL)return;
  try{const r=await (await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:KEY,id,i,v})})).json();
    if(r.error){alert('Not saved: '+r.error);pull()}}catch(e){alert('Could not reach the server. Your tick may not be saved.')}}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();pull();setInterval(pull,15000);
</script></body></html>
